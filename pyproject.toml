[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma-hole-docking"
version = "0.1.0"
description = "Sigma-hole (halogen-bonding) molecular docking pipeline"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "rdkit>=2023.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "py3Dmol>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff", "black", "mypy"]

[project.scripts]
sigma-hole-docking = "sigma_hole_docking.pipeline:main"

[tool.setuptools.packages.find]
include = ["sigma_hole_docking*"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v"]
